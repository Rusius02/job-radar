<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f5f6f2">
    <title>Job Radar — Offres récentes</title>
    <link rel="stylesheet" href="/styles.css">
    <script src="/app.js" defer></script>
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="/" aria-label="Job Radar, accueil">
        <span class="brand-mark" aria-hidden="true">J</span>
        <span>job<span class="brand-accent">radar</span></span>
      </a>
      <nav class="top-actions" aria-label="Navigation principale">
        <a class="settings-link" href="/settings.html"><span aria-hidden="true">⚙</span><span>Paramètres</span></a>
        <a class="profile-link" href="/profile.html">
          <span class="avatar" aria-hidden="true">↗</span>
          <span>Profil</span>
        </a>
      </nav>
    </header>

    <main class="page-shell">
      <section class="intro">
        <p class="eyebrow"><span class="live-dot"></span> VOTRE VEILLE EMPLOI</p>
        <h1>Les bonnes opportunités,<br><span>au bon moment.</span></h1>
        <p class="intro-copy">Retrouvez ici les cinq dernières offres repérées pour vous.</p>
      </section>

      <section class="offers-section" aria-labelledby="offers-title">
        <div class="section-heading">
          <div>
            <p class="eyebrow">SÉLECTION RÉCENTE</p>
            <h2 id="offers-title">Dernières annonces</h2>
          </div>
          <div class="offer-controls">
            <button class="fetch-button" id="fetch-offers" type="button">
              <span aria-hidden="true">↻</span>
              <span>Récupérer les offres</span>
            </button>
            <span class="count-pill" id="offer-count">… offre</span>
          </div>
        </div>
        <p class="collection-status" id="collection-status" role="status" aria-live="polite"></p>
        <div class="offer-list" id="offer-list" aria-live="polite">
          <p class="state-card">Chargement des offres…</p>
        </div>
      </section>
      <footer class="page-footer">Mis à jour à partir des offres enregistrées dans votre veille.</footer>
    </main>
  </body>
</html>
